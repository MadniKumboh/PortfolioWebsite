name: Linting Check

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run HTMLHint
        run: |
          echo "Checking HTML files..."
          find . -name "*.html" | grep . && npx htmlhint "**/*.html" || echo "No HTML files found."
    
      - name: Run Stylelint
        run: |
          echo "Checking CSS files..."
          find . -name "*.css" | grep . && npx stylelint "**/*.css" || echo "No CSS files found."
