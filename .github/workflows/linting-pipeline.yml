name: Linting Check

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run HTMLHint
        run: |
          if ls **/*.html 1> /dev/null 2>&1; then
            npx htmlhint "**/*.html"
          else
            echo "No HTML files found to lint"
          fi
    
      - name: Run Stylelint
        run: |
          if ls **/*.css 1> /dev/null 2>&1; then
            npx stylelint "**/*.css"
          else
            echo "No CSS files found to lint"
          fi
