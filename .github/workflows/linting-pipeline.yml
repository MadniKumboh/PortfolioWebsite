name: Linting Pipeline

# Trigger on push and pull request events for develop branch
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    # Use Ubuntu runner
    runs-on: ubuntu-latest
    
    steps:
    # Checkout the code
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Lint HTML
      run: npx htmlhint "src/**/*.html"

    - name: Lint CSS
      run: npx stylelint "styles/**/*.css"
